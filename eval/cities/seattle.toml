# Seattle's own asset records, one layer per survey item (docs/specs/2026-10-29-city-fields-design.md).
# eval.city_check pairs a survey's findings with these points; assist.export then writes each finding with the
# fields Seattle names a record by, so a finding can be looked up, or a record updated, in the city's own system.
# Another city is another file of this shape: python -m eval.city_check --city <name>.
#
#   layer            GeoJSON of the city's points, relative to the city layers' folder
#   name             the layer as the city calls it
#   inventory        a list of assets (a finding answered "no" is not one)
#   installed_field  install date, epoch milliseconds: a point installed after its photo is not counted
#   truth_field      a field that holds the same yes/no the survey's question asks, and its values (truth_yes/no)
#   id_fields        the fields that name one record in the city's system
#
# eval.asset_check reads these too, to write a row per record:
#   record_field     the id a person would look a record up by
#   checked_field    when the city last touched or checked the record; a layer without one has no date to compare
#   place_field      the record's address in the city's words
#   condition_field  the record's condition in the city's words
#   verified         checked_field says when the city last verified the record, not when the list was written
#   credit           (top level) the words the city's data asks to be shown with its records
#   [items.<id>.compare]  a yes/no field a photo can settle (eval.record_check): the field, its two values, the
#                    question, and what each value says in words

city = "Seattle"
root = "seattle"

[items.utility_pole]
layer = "assets/poles.geojson"
name = "Seattle City Light poles"
inventory = true
id_fields = ["SCLNR", "ASSET_ID"]
record_field = "ASSET_ID"
checked_field = "DATEUPDATED"

[items.utility_pole.compare]
field = "IS_STREETLIGHT"
yes = "YES"
no = "NO"
ask = "Look at the marked pole. Does it hold a street light: a lamp on an arm or on top of the pole? Answer yes if you can see one. Answer no only if the top of the pole is in view and holds no lamp. Answer unclear if the top of the pole is cut off, hidden or too far away."
says_yes = "Holds a street light"
says_no = "Holds no street light"

[items.street_tree]
layer = "assets/trees.geojson"
name = "SDOT street trees"
inventory = true
installed_field = "PLANTED_DATE"
id_fields = ["COMPKEY", "UNITID", "UNITDESC"]
record_field = "UNITID"
checked_field = "LAST_VERIFY_DATE"
verified = true
place_field = "UNITDESC"
condition_field = "CONDITION"

[items.litter_can]
layer = "assets/litter.geojson"
name = "SPU public litter cans"
inventory = true
id_fields = ["pc_sp_id"]
record_field = "pc_sp_id"

[items.parking_pay_station]
layer = "assets/paystations.geojson"
name = "SDOT pay stations"
inventory = true
id_fields = ["OBJECTID"]  # the downloaded layer carries no other number for a pay station
record_field = "OBJECTID"

[items.curb_ramp_warning]
layer = "ramps_capitolhill.geojson"
name = "SDOT curb ramps"
inventory = false
installed_field = "INSTALL_DATE"
truth_field = "DETWARN_EXISTS"
truth_yes = "Y"
truth_no = "N"
id_fields = ["COMPKEY", "UNITID", "UNITDESC"]
record_field = "UNITID"
checked_field = "VERIFICATION_DATE"
verified = true
place_field = "UNITDESC"
condition_field = "CONDITION"

[items.curb_ramp_warning.compare]
field = "DETWARN_EXISTS"
yes = "Y"
no = "N"
ask = "Look at the marked curb ramp. Does it have a detectable warning surface (a panel of raised truncated domes) at its bottom edge? Answer yes if you can see one. Answer no only if the bottom edge is in view and has none. Answer unclear if the bottom edge is too far away, too small or hidden."
says_yes = "Has a detectable warning surface"
says_no = "Has no detectable warning surface"

# Assets Seattle publishes that are not survey items yet: an item the agent writes in the app for one of these is
# tested on the city's own positions instead of a person's answers (docs/specs/2026-10-29-agent-items-design.md 1).
[extra.bike_rack]
names = ["bike rack", "bicycle rack", "bicycle parking rack", "bike parking"]
layer = "assets/bikeracks.geojson"
name = "SDOT bike racks"
id_fields = ["COMPKEY", "UNITID", "UNITDESC"]

[extra.street_sign]
names = ["street sign", "traffic sign", "road sign"]
layer = "assets/signs.geojson"
name = "SDOT signs"
id_fields = ["COMPKEY", "UNITID", "SIGNTYPE"]
