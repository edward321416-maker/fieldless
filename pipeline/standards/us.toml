# Survey standard: United States (ADA). Each [[check]] is a survey item written as sentences: SAM 3.1 finds `find`
# in the photos and Muse Spark answers `ask` on the best photo of it. find_by = "video": SAM follows each object
# through the walk's photos joined as a video, one row per object (pipeline/survey_checks.py). To survey something new, add a [[check]] and
# run the defects stage again (README, "Survey standards"). No training data is needed.
standard = "US"

[path]
surface = "sidewalk"
name = "the sidewalk walking path"
describe = "sidewalks"
objects = ["sandwich board sign", "traffic cone", "electric scooter", "cafe table"]
fixed = []  # poles and hydrants at the curb edge are normal on US sidewalks; not reported

[[check]]
id = "curb_ramp_warning"
map_icon = "curb-ramp"
question = "Does the curb ramp have a detectable warning surface (raised domes) at its bottom edge?"
find = "curb cut"
find_by = "video"
target = "curb ramp"
ask = "A curb ramp is the short sloped section where a pedestrian crossing meets the sidewalk. Driveways, alley entrances and plain raised curbs are not curb ramps; if the photo shows only those, set visible to false. If there is a curb ramp, does it have a detectable warning surface (a panel of raised truncated domes) at its bottom edge? If its bottom edge is too far away or too small to see, answer unclear."
report_when = "no"
label_yes = "Curb ramp with detectable warning"
label_no = "Curb ramp without detectable warning"
label_unclear = "Curb ramp: detectable warning unclear"

# Street assets (inventory): every confirmed object is a point on the map, compared with the city's own inventory.
# find_by is chosen per item on Seattle scan 4's photos (2026-10-28, a rerun of a copy), counting the city's points
# some photo covers, after Spark's check. Poles by video: 12 of 29 in 24 rows, against 11 in 20 by photos in 8 m
# pieces. Curb ramps by video: 9 of 39 in 10 rows, against 10 in 19 by photos (15 of them rejected by a person).
# Litter cans, trees and pay stations stay on photos, where they found more.
# group_m (by photos): things that stand in rows get one row per group_m metres of walk, not one per run of photos.

[[check]]
id = "utility_pole"
map_icon = "street-light"
question = "Is the marked pole a pole for overhead lines or street lighting?"
inventory = true
find = "street light pole"
find_by = "video"
target = "utility or streetlight pole"
ask = "Look at the marked pole. Is it a pole for overhead lines or street lighting: a wooden or metal utility pole, or a streetlight pole (a traffic-signal pole counts only if it also holds a street light arm)? Answer no for a traffic-signal pole that holds only signals, a tree, a sign post, a parking meter, a flagpole or a pole on private land. If the pole is too far away or mostly hidden to tell, answer unclear."
# signal-only poles: two of scan 17's rows (595, 596) were a corner signal pole the review judged not the target
label_yes = "Utility or streetlight pole"
judge = "glimmer"  # stage 1 at medium: agreement 0.79 under 0.85, but no fewer found and no extra false keeps, and of
                   # the 15 photos the two models disagreed on Glimmer was right on 10 (Spark drops signal poles)

[[check]]
id = "street_tree"
map_icon = "tree"
question = "Is this tree planted in the sidewalk or the planting strip?"
inventory = true
find = "street tree"
target = "street tree"
ask = "Is this tree planted in the sidewalk or in the planting strip between the sidewalk and the street? Answer no for a tree in a private yard, behind a fence or clearly on private land. If you cannot tell where it is planted, answer unclear."
label_yes = "Street tree"
group_m = 8  # by photos: by video 16 of the 39 city trees before Spark's check (by photos 19 after it), 7 repeats

[[check]]
id = "litter_can"
map_icon = "litter-bin"
question = "Is this a public litter or recycling can (a fixed city bin)?"
inventory = true
find = "trash can"
target = "public litter can"
ask = "Is this a public litter or recycling can on the sidewalk (a fixed city bin)? Answer no for a private wheeled bin put out for collection. If you cannot tell, answer unclear."
label_yes = "Public litter can"
group_m = 15  # by photos: by video 1 of the 8 city cans after Spark's check, by photos 2
judge = "glimmer"  # Muse Glimmer answers first; passed stage 1 at medium (agreement 0.86, no extra false keeps)

# Written by the Muse Spark item agent (assist.run_inventory) from the city's pay-station list and tested on
# assist/testsets/seattle_paystations.json: SAM 8/12 (0/6 on negatives), Spark confirmed 8/8 (2026-10-28).
# Found by photos, one row per 15 m: the kiosk is small, and by video SAM followed none of scan 4's 4 city pay stations
# (by photos, 2 of 4).
[[check]]
id = "parking_pay_station"
map_icon = "parking-kiosk"
question = "Is this a parking pay station (a grey kiosk with a blue P sign)?"
inventory = true
find = "grey parking kiosk"
target = "parking pay station"
ask = "A parking pay station is a free-standing grey metal kiosk on the sidewalk, waist to chest high with a screen and blue P sign on top, not a single-post parking meter, transit ticket machine, or green utility cabinet. Does this photo show a parking pay station? Answer yes if that kiosk is visible even if partly obscured, no only if it clearly shows only look-alikes. If it is too far away or too small to see, answer unclear."
label_yes = "Parking pay station"
group_m = 15
judge = "glimmer"  # passed stage 1 at low and medium (agreement 0.95, no extra false keeps)
